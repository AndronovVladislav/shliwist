name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /${{ secrets.SSH_USER }}/shliwist
            git pull
            echo "${{ secrets.BACKEND_ENV_FILE }}" > src/env/.stable.env
            echo "${{ secrets.DOCKER_COMPOSE_ENV_FILE }}" > .env
            echo "${{ secrets.POSTGRES_SECRET_MANIFEST }}" > k8s/postgres.yml
            kubectl apply -f -R k8s/
