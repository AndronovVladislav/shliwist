name: Setup Python & Poetry
description: Checkout, set up Python, install Poetry and deps

inputs:
  python-version:
    description: 'Python version'
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      shell: bash
      working-directory: ./src
      run: |
        curl -sSL https://install.python-poetry.org | python${{ inputs.python-version }} -
        poetry install
